<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#FFFFFF" />

  <!-- ================= MAIN CONNECTING ARROWS ================= -->
  <!-- 1. Photo -> Segmentation Gate -->
  <line x1="125" y1="420" x2="167" y2="420" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- 2. Segmentation Gate -> Layout -->
  <line x1="375" y1="420" x2="417" y2="420" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- 3. Layout -> Shadow -->
  <line x1="565" y1="420" x2="607" y2="420" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- 4. Shadow -> Color Grade -->
  <line x1="755" y1="420" x2="797" y2="420" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- 5. Color Grade -> Template Render -->
  <line x1="945" y1="420" x2="987" y2="420" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- 6. Template Render -> Integrity Check -->
  <line x1="1175" y1="420" x2="1217" y2="420" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- 7. Integrity Check -> Image + Metadata -->
  <line x1="1425" y1="420" x2="1467" y2="420" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- ================= BRANCHES ================= -->
  <!-- Branch 1: Segmentation Gate -> REJECT box (Down) -->
  <line x1="272" y1="472" x2="272" y2="578" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- Branch 2: Integrity Check -> Template Render (Loopback Retry) -->
  <path d="M 1321 368 C 1321 270, 1081 270, 1081 364" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-indigo)" />
  
  <!-- Branch 2 Label -->
  <rect x="1120" y="278" width="162" height="26" rx="4" fill="#FFFFFF" />
  <text x="1201" y="296" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#4F46E5">Retry (fixable only)</text>

  <!-- ================= MAIN ROW BOXES ================= -->
  <!-- 1. Photo -->
  <rect x="35" y="380" width="90" height="80" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="80" y="426" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#475569">Photo</text>

  <!-- 2. Segmentation Gate -->
  <rect x="170" y="368" width="205" height="104" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
  <text x="272" y="412" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1E293B">Segmentation Gate</text>
  <text x="272" y="438" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#4F46E5">BiRefNet · PASS/REVIEW/REJECT</text>

  <!-- 3. Layout -->
  <rect x="420" y="368" width="145" height="104" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
  <text x="492" y="427" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1E293B">Layout</text>

  <!-- 4. Shadow -->
  <rect x="610" y="368" width="145" height="104" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
  <text x="682" y="427" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1E293B">Shadow</text>

  <!-- 5. Color Grade -->
  <rect x="800" y="368" width="145" height="104" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
  <text x="872" y="427" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1E293B">Color Grade</text>

  <!-- 6. Template Render -->
  <rect x="990" y="368" width="185" height="104" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
  <text x="1082" y="427" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1E293B">Template Render</text>

  <!-- 7. Integrity Check -->
  <rect x="1220" y="368" width="205" height="104" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" />
  <text x="1322" y="412" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1E293B">Integrity Check</text>
  <text x="1322" y="438" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#4F46E5">4 checks after JPEG</text>

  <!-- 8. Image + Metadata -->
  <rect x="1470" y="380" width="105" height="80" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="1522" y="417" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569">Image +</text>
  <text x="1522" y="437" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569">Metadata</text>

  <!-- ================= BRANCH BOX ================= -->
  <!-- REJECT -> metadata only -->
  <rect x="167" y="582" width="210" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="272" y="615" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#475569">REJECT → metadata only</text>

  <!-- ================= BOTTOM CAPTION ================= -->
  <text x="800" y="740" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94A3B8" letter-spacing="0.3">No food pixels are generated — CPU only</text>
</svg>
