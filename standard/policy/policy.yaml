policy_version: "food_integrity_1.0.2"
# policy_hash intentionally NOT stored in this file - a file cannot correctly
# hash itself (the hash field would have to include its own value). Instead,
# standard/policy/loader.py computes sha256 over this file's raw bytes at
# load time, and standard/policy/policy.lock.json pins the expected hash for
# each policy_version. That lock file is this policy's "git tag/digest"
# (spec §6) in code form: PolicyLoader.register() must be called
# deliberately to pin a version, and PolicyLoader.load() then refuses to
# proceed if the file's bytes ever drift from what was pinned.

mask:
  min_iou: 0.995
  max_area_delta: 0.01

high_frequency:
  base_threshold: 0.04
  # contrast_weight/sharpness_weight: NOT derived from measured data - these
  # are the exact values MENUAI_V1_SPEC.md §6 ships with, carried over as-is.
  # They feed standard/validator/module_b.py's compute_hf_error(), which is
  # itself this build's own provisional formula (§6 gives the two weights
  # but no combining formula) - so both the weights AND how they're used are
  # unvalidated guesses pending real measurements from the §10 360-image
  # MVP test. Retune here, not just in module_b.py, once that data exists.
  contrast_weight: 0.35
  sharpness_weight: 0.50

food:
  max_saturation_gain: 0.05
  max_luminance_gain: 0.10

layout:
  max_scale_delta_per_object: 0.03
  max_relative_scale_ratio_change: 0.02
  preserve_object_area_rank: true
  max_occlusion_change: 0.15
  # Not present in §6's own inline yaml sample, but required by §4's yaml
  # sample and by the Layout Integrity module's stated purpose (front/back
  # order, per the §6 module table). Treated as a §6 doc omission rather
  # than a deliberate exclusion and included here.
  preserve_front_back_order: true

# Severity tagging - same reject_multiplier mechanism as
# standard/config/segmentation.yaml (see standard/severity.py), applied for
# the numeric thresholds above. The two boolean layout checks
# (preserve_object_area_rank, preserve_front_back_order) are NOT listed
# here: §4 already fixes their outcome to REVIEW explicitly
# ("순위 역전 시 REVIEW"; occlusion/front-back: "앞/뒤 순서가 바뀌면 REVIEW"),
# so there is nothing to tag - a boolean check doesn't have a "how far past
# the line" concept a multiplier could act on.
#
# REJECT here never discards a photo: it only hands the violation to the
# Retry state machine (standard/retry/retry_policy.yaml), which ends in PASS
# or, when it can't fix it, REVIEW.
#
# Rule for what gets retried: only what a computer can judge on its own -
# a measurable overshoot with an obvious fix. Color gain qualifies (the
# gain over the original is a number, and a milder grade fixes it; on real
# photos pasta_005 went REVIEW -> one conservative-color retry -> PASS).
# Everything else stays `null` (REVIEW-only) and goes to a human: the HF
# error formula is still an unvalidated placeholder, and whether a
# recomputed layout is actually better is not something the pipeline can
# tell. Retrying those would add complexity without trustworthy results.
severity:
  mask:
    min_iou:
      reject_multiplier: null
    max_area_delta:
      reject_multiplier: null
  high_frequency:
    base_threshold:
      reject_multiplier: null
  food:
    max_saturation_gain:
      reject_multiplier: 1.0
    max_luminance_gain:
      reject_multiplier: 1.0
  layout:
    max_scale_delta_per_object:
      reject_multiplier: null
    max_relative_scale_ratio_change:
      reject_multiplier: null
    max_occlusion_change:
      reject_multiplier: null
