retry:
  max_attempts: 3
  # Only what a computer can judge on its own: a measurable color overshoot
  # with an obvious fix (a milder, then neutral, grade). Layout changes
  # (occlusion, scale, area rank) and the HF content error are deliberately
  # NOT listed - whether a recomputed layout is better, or whether the
  # placeholder HF formula is right, isn't something the pipeline can tell,
  # so those go straight to a human as REVIEW. The strategies still exist in
  # standard/retry/strategies.py; this file decides which ones production uses.
  # See also the severity block in standard/policy/policy.yaml.
  strategy_by_reason:
    FOOD_SATURATION_EXCEEDED: [conservative_color, neutral_color]
    FOOD_LUMINANCE_EXCEEDED: [conservative_color, neutral_color]
  final_action: review   # after the last attempt fails, always hand off to a human - never loop

  # Reason codes with NO entry here have no fallback strategy: the state
  # machine treats them as unfixable rather than silently retrying a no-op.
